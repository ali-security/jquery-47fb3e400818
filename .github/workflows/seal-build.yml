name: seal-build

# Builds dist/ from source and packs the npm tarball exactly the way the
# jQuery 2.2.1 release did. Tests run on Travis (.travis.yml), not here.
on:
  workflow_dispatch:

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write container scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seal" "$RUNNER_TEMP/out"
          cat > "$RUNNER_TEMP/seal/build.sh" <<'SEAL_BUILD_EOF'
          set -euo pipefail
          # build/tasks/build.js appends $COMMIT to the embedded version string.
          unset COMMIT
          TM='https://:2016-02-22T19%3A12%3A09.116Z@time-machines-npm.sealsecurity.io/'
          npm config set registry "$TM"
          node --version
          npm --version
          # left-pad@0.0.3 is pinned exactly by grunt-jscs > jscs > babel-core@5 >
          # line-numbers@0.2.0, but the registry dates it 2016-03-22 (it was
          # restored after the March 2016 unpublish), so the 2016-02-22 time
          # machine hides it. Add just that one version to the time machine's
          # cached left-pad document and let npm use the cache (cache-min).
          NPM_CACHE="$(npm config get cache)"
          npm cache add --registry=https://registry.npmjs.org/ left-pad@0.0.3
          npm view left-pad versions
          node -e '
          var fs = require("fs"), c = process.argv[1],
            live = c + "/registry.npmjs.org/left-pad/.cache.json",
            tm = c + "/time-machines-npm.sealsecurity.io/left-pad/.cache.json",
            l = JSON.parse(fs.readFileSync(live, "utf8")),
            t = JSON.parse(fs.readFileSync(tm, "utf8"));
          t.versions["0.0.3"] = l.versions["0.0.3"];
          fs.writeFileSync(tm, JSON.stringify(t));
          console.log("left-pad versions now: " + Object.keys(t.versions).join(" "));
          ' "$NPM_CACHE"
          npm install --cache-min=999999999
          # Pin the @DATE stamp to the 2.2.1 release value (dist/jquery.js header).
          if ! grep -qF '( new Date() ).toISOString().replace( /:\d+\.\d+Z$/, "Z" )' build/tasks/build.js; then
            echo "@DATE expression not found in build/tasks/build.js"
            exit 1
          fi
          sed -i 's|( new Date() ).toISOString().replace( /:\\d+\\.\\d+Z$/, "Z" )|"2016-02-22T19:11Z"|' build/tasks/build.js
          if ! grep -qF '.replace( /@DATE/g, "2016-02-22T19:11Z" )' build/tasks/build.js; then
            echo "@DATE pin did not apply"
            exit 1
          fi
          # = the `dev` task (build:*:* lint uglify remove_map_comment dist:*)
          # minus lint, which Travis runs on every leg.
          ./node_modules/.bin/grunt 'build:*:*' uglify remove_map_comment 'dist:*'
          ls -la dist
          chown -R "$HOST_UID:$HOST_GID" /work
          SEAL_BUILD_EOF
          cat > "$RUNNER_TEMP/seal/pack.sh" <<'SEAL_PACK_EOF'
          set -euo pipefail
          node --version
          npm --version
          # The published tarball's entries are uid/gid 501/20 (npm 2 keeps
          # each file's owner in the tar entry).
          chown -R 501:20 /pkg
          cd /pkg
          npm pack
          mv jquery-2.2.1.tgz /out/
          chown "$HOST_UID:$HOST_GID" /out/jquery-2.2.1.tgz
          SEAL_PACK_EOF
          cat > "$RUNNER_TEMP/seal/slim.sh" <<'SEAL_SLIM_EOF'
          set -euo pipefail
          node --version
          # Uses the grunt and grunt-contrib-uglify the build step installed in /work.
          ./node_modules/.bin/grunt --gruntfile .github/seal-slim.js \
            --base /work --dist=/pkg/dist
          chown -R "$HOST_UID:$HOST_GID" /pkg
          SEAL_SLIM_EOF
          chmod +x "$RUNNER_TEMP/seal/build.sh" "$RUNNER_TEMP/seal/pack.sh" "$RUNNER_TEMP/seal/slim.sh"

      - name: Build dist (node 0.10 / npm 2, grunt)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$RUNNER_TEMP/seal":/seal \
            -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:0.10 bash /seal/build.sh

      # dist/jquery.js, jquery.min.js and jquery.min.map are tracked at the
      # tag; the build must regenerate them from src/ byte-for-byte. Sealed
      # patches edit src/ only (dist/ is build output), so once src/ differs
      # from the tag the rebuilt dist/ legitimately differs from the tracked
      # copies: the byte-for-byte check applies only to the tag's src/ tree.
      - name: Check rebuilt dist matches the tracked files
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat -- dist/
          # git tree id of src/ at the 2.2.1 tag
          TAG_SRC_TREE=8cba23a6d8360118270e76a07871e2da8783c32a
          if [ "$(git rev-parse HEAD:src)" = "$TAG_SRC_TREE" ]; then
            git diff --exit-code -- dist/
          else
            echo "src/ differs from the 2.2.1 tag (sealed patches): dist/ rebuilt from the patched src/"
          fi

      # build/release/dist.js: the release commit of jquery-dist (tag 2.2.1)
      # is master at the time (56ead6ff, "Release 1.12.1") plus copy(); npm
      # publish ran from that tree. Its README.md and stale files stay.
      - name: Assemble jquery-dist tree (build/release/dist.js copy step)
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/jquery-dist"
          git clone https://github.com/jquery/jquery-dist.git "$D"
          git -C "$D" checkout 56ead6ffbf8560c521e7e94518d35db42b19f5f3
          rm -rf "$D/.git"
          mkdir -p "$D/dist"
          cp -f dist/jquery.js dist/jquery.min.js dist/jquery.min.map "$D/dist/"
          cp -rf src LICENSE.txt AUTHORS.txt package.json "$D/"
          node -e '
          var fs = require("fs"), d = process.argv[1],
            pkg = JSON.parse(fs.readFileSync(d + "/package.json", "utf8"));
          fs.writeFileSync(d + "/bower.json", JSON.stringify({
            name: pkg.name,
            main: pkg.main,
            license: "MIT",
            ignore: [ "package.json" ],
            keywords: pkg.keywords
          }, null, 2));
          ' "$D"
          find "$D" -type f | sort

      # jquery-dist's master at 56ead6ff carries a stray jQuery 3.0.0-beta1
      # slim build (dist/jquery.slim.js, .min.js, .min.map) that the 2.2.1
      # release published as-is and that grunt here never rebuilds. Port the
      # CVE fixes into it and re-minify it with the release's uglify options
      # (.github/seal-slim.js), so the shipped slim files are not left
      # vulnerable.
      - name: Patch the stray slim build (node 0.10, grunt)
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/jquery-dist"
          # Unpatched copies for the exploit check's negative control
          mkdir -p "$RUNNER_TEMP/slim-orig"
          cp -f "$D/dist/jquery.slim.js" "$D/dist/jquery.slim.min.js" "$RUNNER_TEMP/slim-orig/"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$D":/pkg \
            -v "$RUNNER_TEMP/seal":/seal \
            -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:0.10 bash /seal/slim.sh
          ls -la "$D/dist"
          head -c 400 "$D/dist/jquery.slim.min.js"; echo
          # CVE-2020-11023: no unconditional <option>/<optgroup> wrapper left
          if grep -qF "option: [ 1, \"<select multiple='multiple'>\"" "$D/dist/jquery.slim.js" ||
            ! grep -qF 'support.option = !!div.lastChild;' "$D/dist/jquery.slim.js" ||
            grep -qE 'option:\[1,.<select multiple' "$D/dist/jquery.slim.min.js" ||
            ! grep -qE '\.option=!![A-Za-z_$]+\.lastChild' "$D/dist/jquery.slim.min.js"; then
            echo "ERROR: the slim build was not patched and re-minified (CVE-2020-11023)"
            exit 1
          fi
          grep -nE 'support\.option|wrapMap\.option' "$D/dist/jquery.slim.js"
          grep -oE '.{0,40}\.option=!![A-Za-z_$]+\.lastChild.{0,160}' "$D/dist/jquery.slim.min.js"
          # CVE-2020-11022: no rxhtmlTag rewrite left, htmlPrefilter is the identity
          if grep -qF 'rxhtmlTag' "$D/dist/jquery.slim.js" ||
            grep -qF '"<$1></$2>"' "$D/dist/jquery.slim.min.js" ||
            ! grep -qE 'htmlPrefilter:function\(([A-Za-z_$]+)\)\{return \1\}' "$D/dist/jquery.slim.min.js"; then
            echo "ERROR: the slim build was not patched and re-minified (CVE-2020-11022)"
            exit 1
          fi
          grep -n -A2 'htmlPrefilter: function' "$D/dist/jquery.slim.js"
          grep -oE 'htmlPrefilter:function\(([A-Za-z_$]+)\)\{return \1\}' "$D/dist/jquery.slim.min.js"
          # CVE-2019-11358: jQuery.extend skips the __proto__ key
          if ! grep -qF 'if ( name === "__proto__" || target === copy ) {' "$D/dist/jquery.slim.js" ||
            ! grep -qF '"__proto__"' "$D/dist/jquery.slim.min.js"; then
            echo "ERROR: the slim build was not patched and re-minified (CVE-2019-11358)"
            exit 1
          fi
          grep -n -B1 'name === "__proto__"' "$D/dist/jquery.slim.js"
          grep -oE '.{0,40}"__proto__".{0,40}' "$D/dist/jquery.slim.min.js"
          # CVE-2016-10707: the boolean attrHandle wrapper swaps the handler
          # keyed by the lowercase name (no more name.toLowerCase() result,
          # and the handle read uses the hoisted lowercase variable)
          if ! grep -qF 'attrHandle[ lowercaseName ] = handle;' "$D/dist/jquery.slim.js" ||
            grep -qF 'attrHandle[ name ] = handle;' "$D/dist/jquery.slim.js" ||
            grep -qE '\?[A-Za-z_$][A-Za-z0-9_$]*\.toLowerCase\(\):null' "$D/dist/jquery.slim.min.js" ||
            ! grep -qE '([A-Za-z_$][A-Za-z0-9_$]*)=[A-Za-z_$][A-Za-z0-9_$]*\.toLowerCase\(\);return [A-Za-z_$][A-Za-z0-9_$]*\|\|\([A-Za-z_$][A-Za-z0-9_$]*=[A-Za-z_$][A-Za-z0-9_$]*\[\1\]' "$D/dist/jquery.slim.min.js"; then
            echo "ERROR: the slim build was not patched and re-minified (CVE-2016-10707)"
            grep -oE '.{0,100}\.toLowerCase\(\)[;:].{0,100}' "$D/dist/jquery.slim.min.js"
            exit 1
          fi
          grep -n -A12 'lowercaseName = name.toLowerCase();' "$D/dist/jquery.slim.js"
          grep -oE '.{0,80}=[A-Za-z_$][A-Za-z0-9_$]*\.toLowerCase\(\);return [A-Za-z_$][A-Za-z0-9_$]*\|\|.{0,80}' "$D/dist/jquery.slim.min.js"

      # Load each slim file in headless Chrome and run the CVE exploit checks
      # in .github/seal-slim-check.html: the unpatched copies must fail them
      # (the checks reproduce the vulnerability) for every CVE the page
      # covers, the patched ones must pass.
      - name: Exploit check of the slim build (headless Chrome)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --version
          # The CVEs whose checks each tag their failures with "<CVE>: "
          CVES="CVE-2020-11023 CVE-2020-11022 CVE-2019-11358 CVE-2016-10707"
          # Prints the result line after "SEAL-SLIM-CHECK: " (verdict PASS /
          # FAIL / ERROR / NOT first, then the failures; empty if none) on stdout
          slim_check() {
            local file="$1" dir
            dir="$(mktemp -d)"
            cp .github/seal-slim-check.html "$dir/index.html"
            cp "$file" "$dir/jquery-under-test.js"
            if ! timeout 120 "$CHROME" --headless --no-sandbox --disable-gpu \
              --user-data-dir="$dir/profile" --dump-dom "file://$dir/index.html" \
              > "$dir/dom.html" 2> "$dir/chrome.log"; then
              echo "chrome exited non-zero for $file:" >&2
              cat "$dir/chrome.log" >&2
            fi
            echo "$file => $(sed -n 's|.*<pre id="seal-result">\(.*\)</pre>.*|\1|p' "$dir/dom.html")" >&2
            sed -n 's|.*<pre id="seal-result">SEAL-SLIM-CHECK: \(.*\)</pre>.*|\1|p' "$dir/dom.html" | head -n 1
          }
          status=0
          for f in jquery.slim.js jquery.slim.min.js; do
            result="$(slim_check "$RUNNER_TEMP/slim-orig/$f")"
            if [ "${result%% *}" != "FAIL" ]; then
              echo "ERROR: unpatched $f did not reproduce the vulnerability"
              status=1
            fi
            for cve in $CVES; do
              case "$result" in
                *" $cve: "*) echo "unpatched $f reproduces $cve" ;;
                *)
                  echo "ERROR: unpatched $f did not reproduce $cve"
                  status=1
                  ;;
              esac
            done
            result="$(slim_check "$RUNNER_TEMP/jquery-dist/dist/$f")"
            if [ "${result%% *}" != "PASS" ]; then
              echo "ERROR: patched $f failed the exploit checks"
              status=1
            fi
          done
          exit "$status"

      - name: Pack (node 0.10 / npm 2)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/jquery-dist":/pkg \
            -v "$RUNNER_TEMP/seal":/seal \
            -v "$RUNNER_TEMP/out":/out \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:0.10 bash /seal/pack.sh
          tar tzvf "$RUNNER_TEMP/out/jquery-2.2.1.tgz"
          echo "entries: $(tar tzf "$RUNNER_TEMP/out/jquery-2.2.1.tgz" | wc -l)"
          sha256sum "$RUNNER_TEMP/out/jquery-2.2.1.tgz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jquery-npm-tgz
          path: ${{ runner.temp }}/out/jquery-2.2.1.tgz
          if-no-files-found: error
